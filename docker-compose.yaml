services:
  postgres:
    image: postgres:17-alpine
    container_name: nocron-db
    ports:
      - "5432:5432"
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nocron-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 2s
      retries: 5
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # Runs database migrations once
  migration:
    build: ./backend
    image: nocron-backend
    container_name: nocron-migration
    env_file:
      - ./backend/.env
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Main Express API
  backend:
    image: nocron-backend
    container_name: backend-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      FRONTEND_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Outbox sweeper
  sweeper:
    image: nocron-backend
    container_name: backend-sweeper
    env_file:
      - ./backend/.env
    command: ["npm", "run", "start:sweeper"]
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # BullMQ worker
  worker:
    image: nocron-backend
    container_name: backend-worker
    env_file:
      - ./backend/.env
    command: ["npm", "run", "start:worker"]
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # React frontend
  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_DEPLOY_URL: ${VITE_BACKEND_DEPLOY_URL:-http://localhost:8000}
    image: nocron-frontend
    container_name: frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
