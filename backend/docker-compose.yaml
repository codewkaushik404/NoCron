services:
  postgres:
    image: postgres:17-alpine
    container_name: nocron-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nocron-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 2s
      retries: 5
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # Runs database migrations once
  migration:
    build: ./
    image: backend
    container_name: nocron-migration
    env_file:
      - .env
    command: npx prisma migrate deploy
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Main Express API
  backend:
    image: backend
    container_name: nocron-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Outbox sweeper
  sweeper:
    image: backend
    container_name: nocron-sweeper
    env_file:
      - .env
    command: ["npm", "run", "start:sweeper"]
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # BullMQ worker
  worker:
    image: backend
    container_name: nocron-worker
    env_file:
      - .env
    command: ["npm", "run", "start:worker"]
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
        
volumes:
  postgres_data:
  redis_data:
